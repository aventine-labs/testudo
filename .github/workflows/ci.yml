name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testudo-js:
    name: Testudo JS Test & Zero-Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Verify strict zero runtime dependencies
        working-directory: packages/testudo-js
        run: |
          node -e "const pkg = require('./package.json'); if (pkg.dependencies && Object.keys(pkg.dependencies).length > 0) { console.error('Error: Runtime dependencies must be empty!'); process.exit(1); } console.log('Zero runtime dependencies verified.');"

      - name: Run unit tests
        working-directory: packages/testudo-js
        run: npm test

      - name: Build TypeScript
        working-directory: packages/testudo-js
        run: npm run build

      - name: Verify deterministic bundle size limits (<5KB core / <15KB full)
        working-directory: packages/testudo-js
        run: npm run size

  testudo-jmx:
    name: Testudo-JMX Native Go Engine Tests & Multi-Platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install root dependencies
        run: npm ci

      - name: Run Go unit and concurrency tests
        working-directory: packages/testudo-jmx
        run: go test -v -race ./...

      - name: Cross-compile multi-platform binaries
        working-directory: packages/testudo-jmx
        run: make cross-compile

      - name: Build TypeScript programmatic distribution
        working-directory: packages/testudo-jmx
        run: npm run build:ts

      - name: Verify CLI execution and version flag
        working-directory: packages/testudo-jmx
        run: ./bin/testudo-jmx -version

      - name: Run Node integration tests
        working-directory: packages/testudo-jmx
        run: npm run test:node

  python:
    name: Load Engine Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate AventineLoadEngine syntax
        run: python3 -m py_compile packages/testudo-js/engines/python/AventineLoadEngine.py
