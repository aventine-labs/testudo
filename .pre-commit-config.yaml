# Testudo Pre-Commit Configuration
repos:
  - repo: local
    hooks:
      - id: build-check
        name: TypeScript Build Verification
        entry: npm run build
        language: system
        pass_filenames: false
      - id: test-check
        name: Unit Test Verification
        entry: npm test
        language: system
        pass_filenames: false
      - id: size-check
        name: Bundle Size Gate
        entry: npm run size
        language: system
        pass_filenames: false
